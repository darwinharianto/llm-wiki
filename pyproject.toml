[project]
name = "llm-wiki"
version = "0.1.0"
description = "Ever-evolving, self-maintaining LLM Wiki knowledge base inspired by Andrej Karpathy's LLM Wiki pattern"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "google-genai>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

